<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0d0d"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00ccff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title text -->
  <text x="600" y="150" font-family="'Segoe UI', 'Inter', sans-serif" font-size="60" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    Morning News
  </text>

  <!-- Subtitle -->
  <text x="600" y="198" font-family="'Segoe UI', 'Inter', sans-serif" font-size="24" fill="#888888" text-anchor="middle">
    Your news bulletin queue, one tap
  </text>

  <!-- Play button (circle + triangle) -->
  <g transform="translate(600, 340)">
    <circle r="62" fill="none" stroke="#00ccff" stroke-width="4" opacity="0.7"/>
    <path d="M -16,-24 L 34,0 L -16,24 Z" fill="#00ff88"/>
  </g>

  <!-- Audio waveform bars -->
  <g transform="translate(600, 470)">
    <rect x="-220" y="-46" width="14" height="92" rx="4" fill="url(#wave)" opacity="0.55"/>
    <rect x="-190" y="-70" width="14" height="140" rx="4" fill="url(#wave)" opacity="0.75"/>
    <rect x="-160" y="-30" width="14" height="60" rx="4" fill="url(#wave)" opacity="0.5"/>
    <rect x="-130" y="-82" width="14" height="164" rx="4" fill="url(#wave)" opacity="0.9"/>
    <rect x="-100" y="-40" width="14" height="80" rx="4" fill="url(#wave)" opacity="0.55"/>
    <rect x="-70" y="-58" width="14" height="116" rx="4" fill="url(#wave)" opacity="0.7"/>
    <rect x="-40" y="-24" width="14" height="48" rx="4" fill="url(#wave)" opacity="0.5"/>
    <rect x="-10" y="-66" width="14" height="132" rx="4" fill="url(#wave)" opacity="0.8"/>
    <rect x="20" y="-34" width="14" height="68" rx="4" fill="url(#wave)" opacity="0.55"/>
    <rect x="50" y="-74" width="14" height="148" rx="4" fill="url(#wave)" opacity="0.85"/>
    <rect x="80" y="-42" width="14" height="84" rx="4" fill="url(#wave)" opacity="0.6"/>
    <rect x="110" y="-54" width="14" height="108" rx="4" fill="url(#wave)" opacity="0.7"/>
    <rect x="140" y="-28" width="14" height="56" rx="4" fill="url(#wave)" opacity="0.5"/>
    <rect x="170" y="-60" width="14" height="120" rx="4" fill="url(#wave)" opacity="0.75"/>
    <rect x="200" y="-36" width="14" height="72" rx="4" fill="url(#wave)" opacity="0.55"/>
  </g>

  <!-- Decorative glow elements -->
  <circle cx="180" cy="110" r="150" fill="url(#glow)" opacity="0.2"/>
  <circle cx="1020" cy="530" r="200" fill="url(#glow)" opacity="0.15"/>

  <!-- Footer accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#glow)"/>
</svg>
